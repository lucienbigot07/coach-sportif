name: APK Android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du contrat JSON + APK debug
        working-directory: android
        env:
          # valeurs PUBLIQUES (Settings > Secrets and variables > Actions > Variables)
          COACH_SUPABASEURL: ${{ vars.SUPABASE_URL }}
          COACH_SUPABASEANONKEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coach-sportif-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-build
          path: android/app/build/reports/
