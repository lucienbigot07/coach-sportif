name: APK Android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du contrat JSON + APK debug
        working-directory: android
        env:
          # valeurs PUBLIQUES (Settings > Secrets and variables > Actions > Variables)
          COACH_SUPABASEURL: ${{ vars.SUPABASE_URL }}
          COACH_SUPABASEANONKEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coach-sportif-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-build
          path: android/app/build/reports/
      - name: Publier l'APK (lien direct à ouvrir depuis le téléphone)
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk coach-sportif.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest coach-sportif.apk --latest \
            --title "Coach Sportif — dernière version" \
            --notes "Version 0.2.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Installer coach-sportif.apk par-dessus la version actuelle."
